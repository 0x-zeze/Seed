[package]
name = "seed-vault"
version = "0.1.0"
authors = ["Seed"]
edition = "2021"
rust-version = "1.86"
description = "CosmWasm vault that stakes $SEED and deploys treasury margin on Injective iAsset perpetuals."
license = "Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
library = []

[dependencies]
bech32 = "0.11"
cosmwasm-schema = "3.0.2"
cosmwasm-std = "3.0.5"
cw-storage-plus = "3.0.1"
cw2 = "3.0.0"
hex = "0.4"
injective-std = "1.20.0"
serde = { version = "1.0.219", default-features = false, features = ["derive"] }
thiserror = "2.0.12"

[dev-dependencies]
sha2 = "0.10"

[profile.release]
opt-level = 3
debug = false
rpath = false
lto = true
debug-assertions = false
codegen-units = 1
panic = "abort"
incremental = false
overflow-checks = true
